# Manual only: runs the whole suite with quarantine OFF, so every case test/quarantine.json lists actually runs, and its
# current failure stays visible. It is not a gate and never runs on a push. No secrets, no deploy, no release.
name: Quarantine diagnostic

on:
  workflow_dispatch:

concurrency:
  group: quarantine-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: full suite (quarantined cases included)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun x playwright-core install --only-shell chromium && bun x playwright-core install webkit
      - run: bun x playwright-core install-deps webkit
      # quarantine off (the default): the original suite, unfiltered. Expected to fail on the known cases.
      - run: bun run test
        env:
          SHEPHERDR_QUARANTINE: off
