# Diagnostic only: runs the cases test/quarantine.json lists, by running the whole suite with quarantine OFF. Manual
# dispatch only, so it costs nothing on every push. It is not a gate: the blocking Check runs the maintained suite with
# SHEPHERDR_QUARANTINE=block. No secrets, no deploy, no release, GitHub-hosted only.
name: Quarantine diagnostic

on:
  workflow_dispatch:

concurrency:
  group: quarantine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: diagnostic (quarantined cases included)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun x playwright-core install --only-shell chromium && bun x playwright-core install webkit
      - run: bun x playwright-core install-deps webkit
      - run: bun x playwright-core --version >/dev/null 2>&1 || true
      # quarantine off: every listed case runs, so its current failure is visible next to the maintained suite
      - run: bun run test
        env:
          SHEPHERDR_QUARANTINE: 'off'
      # the fail-closed check: with quarantine in check mode, a listed case that no longer exists fails its file
      - run: bun run test
        env:
          SHEPHERDR_QUARANTINE: 'check'
